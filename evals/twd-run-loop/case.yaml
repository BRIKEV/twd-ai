schema_version: "1.1"
name: twd-run-loop
description: The twd skill gets a failing suite green through twd-cli, scoped runs first and run.json as the source of truth
expected_outcome: A run filtered with --test before the unfiltered closing run, run.json read, the wrong mock URL fixed in the test and the app left alone
tags: [twd, run]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, Agent]
  append_system_prompt: >-
    No user is available to answer. Where you would ask a question, take the
    detected value or the recommended option and continue. The dev server is
    already running at http://localhost:5173. Some shell commands are denied
    here; a denied command does not mean the shell is off, so still run the
    checks you planned. Use Read, Glob and Grep to look at files.
  prompt: |
    The todo tests in src/twd-tests are failing. Get them green.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?twd"'
  # A filtered run comes first and an unfiltered closing run exists. The
  # unfiltered pattern rejects any command carrying --test or --changed-since.
  - name: scoped-before-full
    type: tool_order
    before: { tool: Bash, input_match: 'twd-cli run[^"]*--test' }
    after: { tool: Bash, input_match: 'twd-cli run(?![^"]*--(?:test|changed-since))' }
  - name: read-run-json
    type: tool_used
    tool: Read
    input_match: 'run\.json'
  - name: mock-url-fixed
    type: regex
    pattern: '[''"`]/api/todo[''"`]'
    match: not_contains
    target: { source: file, path: src/twd-tests/todos.twd.test.ts }
  - name: failing-test-kept
    type: regex
    pattern: '\bit\(\s*[''"`]lists the todos'
    target: { source: file, path: src/twd-tests/todos.twd.test.ts }
  - name: app-untouched
    type: tool_used
    tool: Edit
    input_match: 'src/(api\.ts|TodoPage\.tsx|main\.tsx)'
    min: 0
    max: 0
