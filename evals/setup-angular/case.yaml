schema_version: "1.1"
name: setup-angular
description: /twd:setup on an Angular CLI app takes the non-Vite path with a build-time guard
expected_outcome: initTWD block guarded by a TWD_ENABLED define (never isDevMode), the define in angular.json, and twd-patterns.md with a type-check command
tags: [setup]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, AskUserQuestion]
  append_system_prompt: >-
    No user is available to answer. Where the skill says to ask, take the
    detected values and the recommended option, approve the edits it proposes,
    and continue. Package installs and the verification run are not possible
    here: skip them and say so in the summary.
  prompt: /twd:setup
graders:
  - name: entry-guarded-by-define
    type: regex
    pattern: 'typeof\s+TWD_ENABLED\s*!==\s*["'']undefined["'']\s*&&\s*TWD_ENABLED'
    target: { source: file, path: src/main.ts }
  - name: no-isdevmode
    type: regex
    pattern: 'isDevMode'
    match: not_contains
    target: { source: file, path: src/main.ts }
  - name: inittwd-before-bootstrap
    type: regex
    pattern: 'initTWD\([\s\S]*bootstrapApplication\('
    target: { source: file, path: src/main.ts }
  - name: define-in-angular-json
    type: regex
    pattern: '"TWD_ENABLED"\s*:\s*"true"'
    target: { source: file, path: angular.json }
  # Eval runs refuse writes into .claude/, so the patterns file never lands on
  # disk. Grade the Write the skill attempted instead of the file.
  - name: patterns-file-attempted
    type: tool_used
    tool: Write
    input_match: '\.claude/twd-patterns\.md'
  - name: patterns-has-typecheck-command
    type: regex
    pattern: 'Type-check command\*\*:\s*`?npx tsc --noEmit -p tsconfig\.app\.json'
    target: trace
  - name: twd-config-written
    type: regex
    pattern: '"url"\s*:\s*"http://localhost:4200'
    target: { source: file, path: twd.config.json }
  - name: no-vite-plugin
    type: file_exists
    path: "vite.config.*"
    exists: false
